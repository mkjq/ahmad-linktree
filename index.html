<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmad</title>
    <meta name="description" content="Ahmad's Personal Linktree">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Background Layer -->
    <div id="background-container">
        <div id="bg-gradient"></div>
        <img id="bg-image" style="display:none" alt="Background">
        <video id="bg-video" autoplay muted loop playsinline style="display:none"></video>
        <div id="bg-overlay"></div>
    </div>
    
    <!-- Particles Effect -->
    <canvas id="particles-canvas"></canvas>

    <!-- Main Content -->
    <main class="main-container">
        
        <!-- Profile Section -->
        <section class="profile-section animate-in">
            <div class="avatar-wrapper">
                <img id="profile-avatar" alt="Ahmad">
            </div>
            <h1 id="profile-name">Ahmad</h1>
            <p id="profile-bio"></p>
        </section>

        <!-- Links Section -->
        <section id="links-section" class="links-section animate-in">
            <h2 id="links-title" class="section-title">روابطي</h2>
            <div id="links-container">
                <!-- Links will be dynamically injected here -->
            </div>
        </section>

        <!-- Gallery Section -->
        <section id="gallery-section" class="gallery-section animate-in">
            <h2 id="gallery-title" class="section-title">معرض الصور</h2>
            <div id="gallery-grid" class="gallery-grid">
                <!-- Gallery items will be dynamically injected here -->
            </div>
        </section>

        <!-- Videos Section -->
        <section id="videos-section" class="videos-section animate-in">
            <h2 id="videos-title" class="section-title">فيديو</h2>
            <div id="videos-grid" class="videos-grid">
                <!-- Video cards will be dynamically injected here -->
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>⚡ Powered by Ahmad</p>
        </footer>

    </main>

    <!-- Lightbox for Gallery -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" aria-label="Close lightbox">&times;</button>
        <div class="lightbox-content">
            <img id="lightbox-img" alt="Enlarged gallery image">
        </div>
    </div>

    <!-- Container for dynamic Custom CSS -->
    <div id="custom-css-container"></div>

    <!-- Scripts -->
    <!-- Assuming storage.js has been provided and sets up the global `storage` object -->
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
